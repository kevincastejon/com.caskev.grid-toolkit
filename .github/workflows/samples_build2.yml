      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT_NAME }}
          targetPlatform: WebGL
          buildMethod: Caskev.GridToolkitCI.GridToolkitCIHelper.Build
          allowDirtyBuild: true
          customParameters: "-stackTraceLogType Full -outputPath ${{ github.workspace }}/GridToolkitSamplesOverview/build/WebGL"

      - name: Prepare samples artifact
        uses: actions/upload-artifact@v4
        with:
          name: samples-site
          path: ${{ github.workspace }}/GridToolkitSamplesOverview/build/WebGL
