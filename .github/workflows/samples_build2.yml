name: Build Samples (reusable)

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-samples:
    runs-on: ubuntu-latest
    env:
      UNITY_VERSION: 6000.2.8f1
      PROJECT_NAME: GridToolkitSamplesOverview
      PKG_GIT: https://github.com/kevincastejon/com.caskev.grid-toolkit.git
      PKG_NAME: com.caskev.grid-toolkit
      PKG_DISPLAYNAME: Grid Toolkit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create blank unity project
        run: |
          PROJECT_DIR="$GITHUB_WORKSPACE/$PROJECT_NAME"
          mkdir -p "$PROJECT_DIR/Assets/Editor"
          mkdir -p "$PROJECT_DIR/Packages"
          mkdir -p "$PROJECT_DIR/ProjectSettings"
          echo "m_EditorVersion: $UNITY_VERSION" > "$PROJECT_DIR/ProjectSettings/ProjectVersion.txt"
          cat > "$PROJECT_DIR/Packages/manifest.json" <<EOF
          {
            "dependencies": {
              "com.unity.modules.ui": "1.0.0",
              "com.unity.modules.uielements": "1.0.0",
              "com.unity.ugui": "1.0.0",
              "com.unity.2d.tilemap": "1.1.0",
              "com.unity.2d.sprite": "1.0.0",
              "com.unity.test-framework": "1.4.5",
              "com.caskev.grid-toolkit": "$PKG_GIT"
            }
          }
          EOF

      - name: Create CI helper script
        run: |
          PROJECT_DIR="$GITHUB_WORKSPACE/$PROJECT_NAME"
          EDITOR_DIR="$PROJECT_DIR/Assets/Editor"
          mkdir -p "$EDITOR_DIR"
          cat > "$EDITOR_DIR/GridToolkitCIHelper.cs" <<'EOF'
          using System;
          using System.Collections.Generic;
          using System.IO;
          using System.Linq;
          using UnityEditor;
          using UnityEditor.Build.Reporting;
          using UnityEditor.PackageManager.UI;
          namespace Caskev.GridToolkitCI
          {
              public static class GridToolkitCIHelper
              {
                  public static void DoNothing()
                  {
                      System.Console.WriteLine("[GridToolkitCIHelper] [Import] Importing temp project assets...");
                  }
                  public static void Build()
                  {
                      PlayerSettings.WebGL.compressionFormat = WebGLCompressionFormat.Brotli;
                      PlayerSettings.WebGL.decompressionFallback = true;
                      SetSamplesScenesIntoBuildSettings();
                      System.Console.WriteLine("[GridToolkitCIHelper] [Build] *****************************************************");
                      System.Console.WriteLine("[GridToolkitCIHelper] [Build] *********************** BUILD ***********************");
                      System.Console.WriteLine("[GridToolkitCIHelper] [Build] *****************************************************");
                      Dictionary<string, string> args = GetCommandLineArgs();
                      System.Console.WriteLine("[GridToolkitCIHelper] [Build] Build path into command line argument is " + args["buildPath"]);

                      BuildPlayerOptions buildPlayerOptions = new BuildPlayerOptions()
                      {
                          target = BuildTarget.WebGL,
                          locationPathName = args["buildPath"],
                          scenes = EditorBuildSettings.scenes.Where(s => s.enabled).Select(s => s.path).ToArray(),
                      };
                      System.Console.WriteLine("[GridToolkitCIHelper] [Build] BuildSettings :");
                      System.Console.WriteLine("[GridToolkitCIHelper] [Build]                  - target : " + buildPlayerOptions.target);
                      System.Console.WriteLine("[GridToolkitCIHelper] [Build]                  - locationPathName : " + buildPlayerOptions.locationPathName);
                      System.Console.WriteLine("[GridToolkitCIHelper] [Build]                  - scenes : " + string.Join(", ", buildPlayerOptions.scenes));

                      BuildReport report = BuildPipeline.BuildPlayer(buildPlayerOptions);
                      if (report.summary.result == BuildResult.Succeeded)
                      {
                          System.Console.WriteLine("[GridToolkitCIHelper] Build has succeed");
                      }
                      else
                      {
                          System.Console.WriteLine("[GridToolkitCIHelper] Build has failed");
                      }
                  }
                  private static Dictionary<string, string> GetCommandLineArgs()
                  {
                      string[] args = Environment.GetCommandLineArgs();
                      var dict = new Dictionary<string, string>(StringComparer.OrdinalIgnoreCase);

                      for (int i = 0; i < args.Length; i++)
                      {
                          string arg = args[i];
                          if (arg.StartsWith("-"))
                          {
                              string key = arg.TrimStart('-');
                              string value = string.Empty;
                              if (i + 1 < args.Length && !args[i + 1].StartsWith("-"))
                              {
                                  value = args[i + 1];
                                  i++;
                              }

                              dict[key] = value;
                          }
                      }

                      return dict;
                  }
                  private static void SetSamplesScenesIntoBuildSettings()
                  {
                      string packageName = "com.caskev.grid-toolkit";
                      UnityEditor.PackageManager.PackageInfo info = UnityEditor.PackageManager.PackageInfo.FindForPackageName(packageName);
                      System.Console.WriteLine("[GridToolkitCIHelper] [SetSamplesScenesIntoBuildSettings] Finding samples for " + packageName + "...");
                      var samples = (Sample.FindByPackage(packageName, null) ?? Enumerable.Empty<Sample>()).ToList();
                      if (samples.Count == 0)
                      {
                          System.Console.WriteLine("[GridToolkitCIHelper] [SetSamplesScenesIntoBuildSettings] No samples found");
                          return;
                      }
                      List<EditorBuildSettingsScene> newScenes = new()
                      {
                          new EditorBuildSettingsScene("Assets/SamplesOverview.unity", true)
                      };
                      System.Console.WriteLine("[GridToolkitCIHelper] [SetSamplesScenesIntoBuildSettings] SamplesOverview autogenerated scene has been set into builds settings");
                      foreach (var s in samples)
                      {
                          if (File.Exists(Path.Combine(UnityEngine.Application.dataPath, "Samples", s.displayName, s.displayName + ".unity")))
                          {
                              newScenes.Add(new EditorBuildSettingsScene("Assets/Samples/" + s.displayName + "/" + s.displayName + ".unity", true));
                              System.Console.WriteLine("[GridToolkitCIHelper] Sample: " + s.displayName + " scene has been set into builds settings");
                          }
                          else
                          {
                              System.Console.WriteLine("[GridToolkitCIHelper] Sample: " + s.displayName + " has no scene");
                          }
                      }
                      EditorBuildSettings.scenes = newScenes.ToArray();
                  }
              }
          }
          EOF

      - name: Import packages
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT_NAME }}
          targetPlatform: WebGL
          buildMethod: Caskev.GridToolkitCI.GridToolkitCIHelper.DoNothing
          allowDirtyBuild: true
          customParameters: "-stackTraceLogType Full"

      - name: Import TMP
        run: |
          set -euo pipefail
          PROJECT_DIR="$GITHUB_WORKSPACE/$PROJECT_NAME"
          PKG_FILE="$(find "$PROJECT_DIR/Library/PackageCache" -type f -path "*/com.unity.ugui@*/Package Resources/TMP Essential Resources.unitypackage" -print -quit)"
          if [ -z "${PKG_FILE:-}" ]; then
            echo "TMP Essential Resources.unitypackage not found"
            exit 1
          fi
          WORKDIR="$(mktemp -d)"
          tar -xzf "$PKG_FILE" -C "$WORKDIR"
          while IFS= read -r -d '' D; do
            P="$(cat "$D/pathname")"
            ASSET="$D/asset"
            META="$D/asset.meta"
            DEST="$PROJECT_DIR/$P"
            mkdir -p "$(dirname "$DEST")"
            if [ -f "$ASSET" ]; then cp -f "$ASSET" "$DEST"; fi
            if [ -f "$META" ]; then cp -f "$META" "$DEST.meta"; fi
          done < <(find "$WORKDIR" -mindepth 1 -maxdepth 1 -type d -print0)
          rm -rf "$WORKDIR"

      - name: Import samples
        run: |
          set -euo pipefail
          PROJECT_DIR="$GITHUB_WORKSPACE/$PROJECT_NAME"
          SRC_DIR="$(find "$PROJECT_DIR/Library/PackageCache" -type d -path "*/com.caskev.grid-toolkit@*/Samples~" -print -quit)"
          if [ -z "${SRC_DIR:-}" ]; then
            echo "Samples~ folder not found"
            exit 1
          fi
          DEST_DIR="$PROJECT_DIR/Assets/Samples"
          mkdir -p "$DEST_DIR"
          cp -R "$SRC_DIR/"* "$DEST_DIR/"

