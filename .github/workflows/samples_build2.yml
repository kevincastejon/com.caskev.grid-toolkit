name: Build Samples (reusable)

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-samples:
    runs-on: ubuntu-latest
    env:
      UNITY_VERSION: 6000.2.8f1
      PROJECT_NAME: GridToolkitSamplesOverview
      PKG_GIT: https://github.com/kevincastejon/com.caskev.grid-toolkit.git
      PKG_NAME: com.caskev.grid-toolkit
      PKG_DISPLAYNAME: Grid Toolkit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create blank unity project
        run: |
          PROJECT_DIR="$GITHUB_WORKSPACE/$PROJECT_NAME"
          echo "Project path: $PROJECT_DIR"
          mkdir -p "$PROJECT_DIR/Assets/Editor"
          mkdir -p "$PROJECT_DIR/Packages"
          mkdir -p "$PROJECT_DIR/ProjectSettings"
          echo "m_EditorVersion: $UNITY_VERSION" > "$PROJECT_DIR/ProjectSettings/ProjectVersion.txt"
          cat > "$PROJECT_DIR/Packages/manifest.json" <<EOF
          {
            "dependencies": {
              "com.unity.modules.ui": "1.0.0",
              "com.unity.modules.uielements": "1.0.0",
              "com.unity.ugui": "1.0.0",
              "com.unity.2d.tilemap": "1.1.0",
              "com.unity.2d.sprite": "1.0.0",
              "com.unity.test-framework": "1.4.5",
              "com.caskev.grid-toolkit": "$PKG_GIT"
            }
          }
          EOF

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/${{ env.PROJECT_NAME }}/Library
          key: Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles(format('{0}/Packages/manifest.json', env.PROJECT_NAME), format('{0}/Packages/packages-lock.json', env.PROJECT_NAME)) }}
          restore-keys: |
            Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-
            Library-${{ runner.os }}-

      - name: Create CI helper script
        run: |
          PROJECT_DIR="$GITHUB_WORKSPACE/$PROJECT_NAME"
          EDITOR_DIR="$PROJECT_DIR/Assets/Editor"
          mkdir -p "$EDITOR_DIR"
          cat > "$EDITOR_DIR/GridToolkitCIHelper.cs" <<'EOF'
          using System;
          using System.Collections.Generic;
          using System.IO;
          using System.Linq;
          using UnityEditor;
          using UnityEditor.Build.Reporting;
          using UnityEditor.PackageManager.UI;
          namespace Caskev.GridToolkitCI
          {
              public static class GridToolkitCIHelper
              {
                  public static void DoNothing()
                  {
                      System.Console.WriteLine("[GridToolkitCIHelper] [Import] Importing temp project assets...");
                  }
                  public static void Build()
                  {
                      PlayerSettings.WebGL.compressionFormat = WebGLCompressionFormat.Brotli;
                      PlayerSettings.WebGL.decompressionFallback = true;
                      SetSamplesScenesIntoBuildSettings();
                      System.Console.WriteLine("[GridToolkitCIHelper] [Build] *****************************************************");
                      System.Console.WriteLine("[GridToolkitCIHelper] [Build] *********************** BUILD ***********************");
                      System.Console.WriteLine("[GridToolkitCIHelper] [Build] *****************************************************");
                      Dictionary<string, string> args = GetCommandLineArgs();
                      System.Console.WriteLine("[GridToolkitCIHelper] [Build] Build path into command line argument is " + args["outputPath"]);

                      BuildPlayerOptions buildPlayerOptions = new BuildPlayerOptions()
                      {
                          target = BuildTarget.WebGL,
                          locationPathName = args["outputPath"],
                          scenes = EditorBuildSettings.scenes.Where(s => s.enabled).Select(s => s.path).ToArray(),
                      };
                      System.Console.WriteLine("[GridToolkitCIHelper] [Build] BuildSettings :");
                      System.Console.WriteLine("[GridToolkitCIHelper] [Build]                  - target : " + buildPlayerOptions.target);
                      System.Console.WriteLine("[GridToolkitCIHelper] [Build]                  - locationPathName : " + buildPlayerOptions.locationPathName);
                      System.Console.WriteLine("[GridToolkitCIHelper] [Build]                  - scenes : " + string.Join(", ", buildPlayerOptions.scenes));

                      BuildReport report = BuildPipeline.BuildPlayer(buildPlayerOptions);
                      if (report.summary.result == BuildResult.Succeeded)
                      {
                          System.Console.WriteLine("[GridToolkitCIHelper] Build has succeed");
                      }
                      else
                      {
                          System.Console.WriteLine("[GridToolkitCIHelper] Build has failed");
                      }
                  }
                  private static Dictionary<string, string> GetCommandLineArgs()
                  {
                      string[] args = Environment.GetCommandLineArgs();
                      var dict = new Dictionary<string, string>(StringComparer.OrdinalIgnoreCase);

                      for (int i = 0; i < args.Length; i++)
                      {
                          string arg = args[i];
                          if (arg.StartsWith("-"))
                          {
                              string key = arg.TrimStart('-');
                              string value = string.Empty;
                              if (i + 1 < args.Length && !args[i + 1].StartsWith("-"))
                              {
                                  value = args[i + 1];
                                  i++;
                              }

                              dict[key] = value;
                          }
                      }

                      return dict;
                  }
                  private static void SetSamplesScenesIntoBuildSettings()
                  {
                      string packageName = "com.caskev.grid-toolkit";
                      UnityEditor.PackageManager.PackageInfo info = UnityEditor.PackageManager.PackageInfo.FindForPackageName(packageName);
                      System.Console.WriteLine("[GridToolkitCIHelper] [SetSamplesScenesIntoBuildSettings] Finding samples for " + packageName + "...");
                      var samples = (Sample.FindByPackage(packageName, null) ?? Enumerable.Empty<Sample>()).ToList();
                      if (samples.Count == 0)
                      {
                          System.Console.WriteLine("[GridToolkitCIHelper] [SetSamplesScenesIntoBuildSettings] No samples found");
                          return;
                      }
                      List<EditorBuildSettingsScene> newScenes = new()
                      {
                          new EditorBuildSettingsScene("Assets/SamplesOverview.unity", true)
                      };
                      System.Console.WriteLine("[GridToolkitCIHelper] [SetSamplesScenesIntoBuildSettings] SamplesOverview autogenerated scene has been set into builds settings");
                      foreach (var s in samples)
                      {
                          if (File.Exists(Path.Combine(UnityEngine.Application.dataPath, "Samples", s.displayName, s.displayName + ".unity")))
                          {
                              newScenes.Add(new EditorBuildSettingsScene("Assets/Samples/" + s.displayName + "/" + s.displayName + ".unity", true));
                              System.Console.WriteLine("[GridToolkitCIHelper] Sample: " + s.displayName + " scene has been set into builds settings");
                          }
                          else
                          {
                              System.Console.WriteLine("[GridToolkitCIHelper] Sample: " + s.displayName + " has no scene");
                          }
                      }
                      EditorBuildSettings.scenes = newScenes.ToArray();
                  }
              }
          }
          EOF

      - name: Import packages
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT_NAME }}
          targetPlatform: WebGL
          buildMethod: Caskev.GridToolkitCI.GridToolkitCIHelper.DoNothing
          allowDirtyBuild: true
          customParameters: "-stackTraceLogType Full"

      - name: Import TMP
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "ERROR on line $LINENO: $BASH_COMMAND"' ERR
          export PS4='+ $BASH_SOURCE:$LINENO: '
          set -x
          PROJECT_DIR="$GITHUB_WORKSPACE/$PROJECT_NAME"
          test -f "$PROJECT_DIR/Packages/packages-lock.json"
          UGUI_VERSION="$(jq -r '.dependencies["com.unity.ugui"].version // empty' "$PROJECT_DIR/Packages/packages-lock.json")"
          if [ -z "$UGUI_VERSION" ]; then
            echo "com.unity.ugui not found in packages-lock.json"
            exit 1
          fi
          BASE_DIR="$PROJECT_DIR/Library/PackageCache/com.unity.ugui@$UGUI_VERSION"
          PKG_FILE="$BASE_DIR/Package Resources/TMP Essential Resources.unitypackage"
          if [ ! -f "$PKG_FILE" ]; then
            PKG_FILE="$(find "$PROJECT_DIR/Library/PackageCache" -type f -path "*/com.unity.ugui@*/Package Resources/TMP Essential Resources.unitypackage" -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2- || true)"
          fi
          if [ -z "${PKG_FILE:-}" ] || [ ! -f "$PKG_FILE" ]; then
            echo "TMP Essential Resources.unitypackage not found under com.unity.ugui"
            ls -la "$PROJECT_DIR/Library/PackageCache" || true
            find "$PROJECT_DIR/Library/PackageCache" -maxdepth 2 -type d -name "com.unity.ugui@*" -print || true
            exit 1
          fi
          WORKDIR="$(mktemp -d)"
          tar -xzvf "$PKG_FILE" -C "$WORKDIR"
          while IFS= read -r -d '' D; do
            P="$(cat "$D/pathname")"
            ASSET="$D/asset"
            META="$D/asset.meta"
            DEST="$PROJECT_DIR/$P"
            mkdir -p "$(dirname "$DEST")"
            [ -f "$ASSET" ] && cp -f "$ASSET" "$DEST"
            [ -f "$META" ] && cp -f "$META" "$DEST.meta"
          done < <(find "$WORKDIR" -mindepth 1 -maxdepth 1 -type d -print0)
          rm -rf "$WORKDIR"


      - name: Import samples
        shell: bash
        run: |
          set -Eeuo pipefail
          PROJECT_DIR="$GITHUB_WORKSPACE/$PROJECT_NAME"
          PKG_VERSION="$(jq -r ".dependencies[\"$PKG_NAME\"].version // empty" "$PROJECT_DIR/Packages/packages-lock.json")"
          if [ -z "$PKG_VERSION" ]; then
            echo "$PKG_NAME not found in packages-lock.json"
            exit 1
          fi
          SRC_DIR="$PROJECT_DIR/Library/PackageCache/$PKG_NAME@$PKG_VERSION/Samples~"
          if [ ! -d "$SRC_DIR" ]; then
            SRC_DIR="$(find "$PROJECT_DIR/Library/PackageCache" -type d -path "*/$PKG_NAME@*/Samples~" -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2- || true)"
          fi
          if [ -z "${SRC_DIR:-}" ] || [ ! -d "$SRC_DIR" ]; then
            echo "Samples~ folder not found under $PKG_NAME"
            exit 1
          fi
          DEST_DIR="$PROJECT_DIR/Assets/Samples"
          mkdir -p "$DEST_DIR"
          cp -R "$SRC_DIR/." "$DEST_DIR/"


      - name: Generate SamplesOverview files
        run: |
          PROJECT_DIR="$GITHUB_WORKSPACE/$PROJECT_NAME"
          mkdir -p "$PROJECT_DIR/Assets"
          cat > "$PROJECT_DIR/Assets/SamplesOverviewNavigation.cs" <<'EOF'
          using System;
          using System.Collections.Generic;
          using TMPro;
          using UnityEngine;
          using UnityEngine.SceneManagement;
          using UnityEngine.UI;
          namespace GridToolkit.CIHelper
          {
              public class SceneData
              {
                  public string name;
                  public int buildIndex = -1;
                  public Button button;

                  public SceneData(string name, int buildIndex)
                  {
                      this.name = name;
                      this.buildIndex = buildIndex;
                  }
              }
              public class SampleOverviewNavigation : MonoBehaviour
              {
                  [SerializeField] private Button _modelButton;
                  private Button[] _buttons;
                  private List<SceneData> _scenes = new();
                  private SceneData _currentSample;
                  private void Start()
                  {
                      int sceneCount = SceneManager.sceneCountInBuildSettings;
                      for (int i = 0; i < sceneCount; i++)
                      {
                          string scenePath = SceneUtility.GetScenePathByBuildIndex(i);
                          if (gameObject.scene.path == scenePath)
                          {
                              continue;
                          }
                          string sceneName = System.IO.Path.GetFileNameWithoutExtension(scenePath);
                          SceneData scene = new(sceneName, i);
                          _scenes.Add(scene);
                      }
                      _buttons = new Button[sceneCount - 1];
                      _buttons[0] = _modelButton;
                      for (int i = 0; i < _scenes.Count; i++)
                      {
                          SceneData scene = _scenes[i];
                          Button button;
                          if (i > 0)
                          {
                              button = Instantiate(_modelButton, _modelButton.transform.parent);
                          }
                          else
                          {
                              button = _modelButton;
                          }
                          scene.button = button;
                          button.GetComponentInChildren<TextMeshProUGUI>().text = scene.name;
                          int index = i;
                          button.onClick.AddListener(() =>
                          {
                              ChangeSample(index);
                          });
                      }
                      ChangeSample(0);
                  }

                  private async void ChangeSample(int index)
                  {
                      if (_currentSample != null)
                      {
                          _currentSample.button.interactable = true;
                          await SceneManager.UnloadSceneAsync(_currentSample.buildIndex);
                      }
                      _currentSample = _scenes[index];
                      _currentSample.button.interactable = false;
                      await SceneManager.LoadSceneAsync(_scenes[index].buildIndex, LoadSceneMode.Additive);
                  }
              }
          }
