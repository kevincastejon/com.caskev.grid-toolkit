name: Build Samples (reusable)
on:
  workflow_call:

jobs:
  build-samples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create temp Unity project
        env:
          UNITY_VER: 6000.2.8f1
        run: |
          mkdir -p TempProject/Assets TempProject/Packages TempProject/ProjectSettings
          cat > TempProject/Packages/manifest.json << 'JSON'
          {
            "dependencies": {
              "com.unity.modules.ui": "1.0.0",
              "com.unity.modules.uielements": "1.0.0",
              "com.unity.ugui": "1.0.0",
              "com.unity.textmeshpro": "3.0.9",
              "com.unity.2d.tilemap": "1.1.0",
              "com.unity.2d.sprite": "1.0.0",
              "com.unity.test-framework": "1.4.5",
              "com.caskev.grid-toolkit": "https://github.com/kevincastejon/com.caskev.grid-toolkit.git#${{ github.sha }}"
            }
          }
          JSON
          echo "m_EditorVersion: ${UNITY_VER}" > TempProject/ProjectSettings/ProjectVersion.txt

      - name: Add editor build script
        run: |
          mkdir -p TempProject/Assets/Editor
          cat > TempProject/Assets/Editor/BuildSamples.cs << 'CS'
          using System;
          using System.IO;
          using System.Linq;
          using System.Collections;
          using System.Collections.Generic;
          using System.Reflection;
          using UnityEditor;
          using UnityEditor.PackageManager;
          using UnityEditor.PackageManager.Requests;
          using UnityEngine;

          public static class BuildSamples
          {
              [Serializable] class PackageJson { public SampleEntry[] samples; }
              [Serializable] class SampleEntry { public string displayName; public string description; public string path; }

              [MenuItem("CI/Build WebGL Samples")]
              public static void Run()
              {
                  PlayerSettings.WebGL.compressionFormat = WebGLCompressionFormat.Brotli;
                  PlayerSettings.WebGL.decompressionFallback = true;

                  // Ensure TMP Essentials once (for visible TMPro at runtime)
                  EnsureTmpEssentials();

                  // Locate package
                  string packageName = "com.caskev.grid-toolkit";
                  var list = Client.List(true);
                  while (!list.IsCompleted) System.Threading.Thread.Sleep(50);
                  var pkgInfo = list.Result.FirstOrDefault(p => p.name == packageName);
                  if (pkgInfo == null) throw new Exception("Package not found: " + packageName);
                  string pkgPath = pkgInfo.resolvedPath;
                  string pkgJsonPath = Path.Combine(pkgPath, "package.json");
                  if (!File.Exists(pkgJsonPath)) throw new Exception("package.json not found: " + pkgJsonPath);

                  var cfg = JsonUtility.FromJson<PackageJson>(File.ReadAllText(pkgJsonPath));
                  if (cfg == null || cfg.samples == null || cfg.samples.Length == 0) {
                      Debug.LogWarning("No samples declared in package.json");
                      return;
                  }

                  // Import samples using Unity's Sample API (preserves GUID/meta)
                  var imported = ImportSamplesWithApi(pkgInfo);

                  string outRoot = "build-webgl";
                  Directory.CreateDirectory(outRoot);

                  foreach (var s in cfg.samples)
                  {
                      if (s == null || string.IsNullOrEmpty(s.path)) continue;

                      // Try to find the import folder that corresponds to this sample
                      // Match by displayName or last folder name of 'path'
                      string folderName = Path.GetFileName(s.path.TrimEnd('/', '\\'));
                      string wantedA = s.displayName ?? folderName;
                      string wantedB = folderName;

                      string importedDir = imported
                          .FirstOrDefault(d =>
                              string.Equals(Path.GetFileName(d), MakeSafe(wantedA), StringComparison.OrdinalIgnoreCase) ||
                              string.Equals(Path.GetFileName(d), MakeSafe(wantedB), StringComparison.OrdinalIgnoreCase));

                      if (string.IsNullOrEmpty(importedDir) || !Directory.Exists(importedDir))
                      {
                          Debug.LogWarning("Imported sample folder not found for: " + (s.displayName ?? s.path));
                          continue;
                      }

                      // Find scene matching displayName or folder name
                      var want = new HashSet<string>(new[]{ wantedA, wantedB }, StringComparer.OrdinalIgnoreCase);
                      var scenes = Directory.GetFiles(importedDir, "*.unity", SearchOption.AllDirectories)
                                            .Where(p => want.Contains(Path.GetFileNameWithoutExtension(p)))
                                            .Select(Norm)
                                            .ToArray();
                      if (scenes.Length == 0)
                      {
                          Debug.LogWarning("No matching scene for sample: " + importedDir);
                          continue;
                      }

                      string safeName = Path.GetFileName(importedDir);
                      string buildDir = Path.Combine(outRoot, safeName);
                      Directory.CreateDirectory(buildDir);

                      var report = BuildPipeline.BuildPlayer(scenes, buildDir, BuildTarget.WebGL, BuildOptions.None);
                      if (report.summary.result != UnityEditor.Build.Reporting.BuildResult.Succeeded)
                          throw new Exception("Build failed for sample: " + safeName);
                  }

                  AssetDatabase.Refresh();
              }

              static List<string> ImportSamplesWithApi(UnityEditor.PackageManager.PackageInfo pkgInfo)
              {
                  var results = new List<string>();
                  // Try both APIs depending on Unity version
                  var t = Type.GetType("UnityEditor.PackageManager.UI.Sample, UnityEditor.PackageManagerUI.Editor", false)
                          ?? Type.GetType("UnityEditor.PackageManager.Sample, UnityEditor.Editor", false);
                  if (t == null) throw new Exception("Unity Sample API type not found");

                  // samples = Sample.FindByPackage(pkgInfo)
                  var find = t.GetMethod("FindByPackage", BindingFlags.Public | BindingFlags.Static);
                  if (find == null) throw new Exception("FindByPackage method not found on Sample type");

                  var samplesObj = find.Invoke(null, new object[]{ pkgInfo });
                  var enumerable = samplesObj as IEnumerable;
                  if (enumerable == null) throw new Exception("FindByPackage did not return IEnumerable");

                  foreach (var s in enumerable)
                  {
                      // Properties we need: displayName, importPath, resolvedPath
                      string displayName = SafeGetProp<string>(s, "displayName");
                      string importPath  = SafeGetProp<string>(s, "importPath");  // e.g. Assets/Samples/<pkg>/<Sample>
                      if (string.IsNullOrEmpty(importPath)) {
                          // Some Unity versions expose 'path' which is source; default import path if needed
                          importPath = Path.Combine("Assets", "Samples", pkgInfo.name, MakeSafe(displayName));
                      }

                      // Import the sample using its API
                      var import = t.GetMethod("Import", BindingFlags.Public | BindingFlags.Instance, null, Type.EmptyTypes, null)
                                 ?? t.GetMethod("Import", BindingFlags.Public | BindingFlags.Instance, null, new[]{ typeof(bool) }, null)
                                 ?? t.GetMethod("Import", BindingFlags.Public | BindingFlags.Instance, null, new[]{ typeof(string) }, null);
                      if (import == null) throw new Exception("No supported Import() method on Sample type");

                      try
                      {
                          if (import.GetParameters().Length == 0) import.Invoke(s, null);
                          else if (import.GetParameters().Length == 1 && import.GetParameters()[0].ParameterType == typeof(bool)) import.Invoke(s, new object[]{ true });
                          else import.Invoke(s, new object[]{ importPath });
                          AssetDatabase.Refresh();
                          results.Add(importPath.Replace('\\','/'));
                      }
                      catch (TargetInvocationException tie)
                      {
                          Debug.LogWarning("Sample import failed for " + displayName + ": " + tie.InnerException?.Message);
                      }
                  }
                  return results;
              }

              static T SafeGetProp<T>(object obj, string name)
              {
                  var p = obj.GetType().GetProperty(name, BindingFlags.Public | BindingFlags.Instance);
                  if (p == null) return default;
                  var v = p.GetValue(obj, null);
                  if (v == null) return default;
                  return (T)v;
              }

              static void EnsureTmpEssentials()
              {
                  var existing = AssetDatabase.LoadAssetAtPath<ScriptableObject>("Assets/TextMesh Pro/Resources/TMP Settings.asset");
                  if (existing) return;
                  if (!EditorApplication.ExecuteMenuItem("Window/TextMeshPro/Import TMP Essential Resources"))
                      Debug.LogWarning("TMP Essentials import menu did not execute");
                  AssetDatabase.Refresh();
              }

              static string Norm(string p) => p.Replace('\\','/');
              static string MakeSafe(string name) { foreach (char c in Path.GetInvalidFileNameChars()) name = name.Replace(c, '_'); return name; }
          }
          CS



      # - name: Cache Library
      #   uses: actions/cache@v3
      #   with:
      #     path: TempProject/Library
      #     key: Library-GridToolkit-WebGL-6000.2.8f1
      #     restore-keys: |
      #       Library-GridToolkit-WebGL-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: TempProject
          targetPlatform: WebGL
          unityVersion: 6000.2.8f1
          buildMethod: BuildSamples.Run
          versioning: None
          customParameters: -stackTraceLogType Full
      - name: Prepare samples artifact
        run: |
          set -e
          mkdir -p public-samples/samples
          cp -r TempProject/build-webgl/* public-samples/samples/ || true

          if [ ! -f public-samples/samples/index.html ]; then
            printf '%s\n' \
              '<!doctype html>' \
              '<meta charset="utf-8">' \
              '<title>Samples</title>' \
              '<h1>Samples</h1>' \
              '<ul id="list"></ul>' \
              '<script>' \
              "fetch('./').then(r=>r.text()).then(t=>{" \
              "  const rx=/href=\"([^\"]+)\\//g;let m,items=[];" \
              "  while((m=rx.exec(t))!==null){const n=m[1];if(!n.startsWith('.')&&n!=='')items.push(n);}" \
              "  const ul=document.getElementById('list');" \
              "  if(items.length===0){ul.innerHTML='<li>No samples</li>';return;}" \
              "  items.forEach(n=>{if(n==='index.html')return;const li=document.createElement('li');const a=document.createElement('a');a.href=n+'/index.html';a.textContent=n;li.appendChild(a);ul.appendChild(li);});" \
              '});' \
              '</script>' \
            > public-samples/samples/index.html
          fi
      - name: Upload samples artifact
        uses: actions/upload-artifact@v4
        with:
          name: samples-site
          path: public-samples
