          cat > "$PROJ/Assets/SampleOverviewNavigation.cs" <<'EOF'
          using System;
          using System.Collections.Generic;
          using TMPro;
          using UnityEngine;
          using UnityEngine.SceneManagement;
          using UnityEngine.UI;
          namespace GridToolkit.CIHelper
          {
              public class SceneData
              {
                  public string name;
                  public int buildIndex = -1;
                  public Button button;
                  public SceneData(string name, int buildIndex)
                  {
                      this.name = name;
                      this.buildIndex = buildIndex;
                  }
              }
              public class SampleOverviewNavigation : MonoBehaviour
              {
                  [SerializeField] private Button _modelButton;
                  private Button[] _buttons;
                  private List<SceneData> _scenes = new();
                  private SceneData _currentSample;
                  private void Start()
                  {
                      int sceneCount = SceneManager.sceneCountInBuildSettings;
                      for (int i = 0; i < sceneCount; i++)
                      {
                          string scenePath = SceneUtility.GetScenePathByBuildIndex(i);
                          if (gameObject.scene.path == scenePath) { continue; }
                          string sceneName = System.IO.Path.GetFileNameWithoutExtension(scenePath);
                          SceneData scene = new(sceneName, i);
                          _scenes.Add(scene);
                      }
                      _buttons = new Button[_scenes.Count];
                      for (int i = 0; i < _scenes.Count; i++)
                      {
                          var scene = _scenes[i];
                          Button button = i == 0 ? _modelButton : Instantiate(_modelButton, _modelButton.transform.parent);
                          scene.button = button;
                          button.GetComponentInChildren<TextMeshProUGUI>().text = scene.name;
                          int index = i;
                          button.onClick.AddListener(() => { ChangeSample(index); });
                      }
                      if (_scenes.Count > 0) ChangeSample(0);
                  }
                  private async void ChangeSample(int index)
                  {
                      if (_currentSample != null)
                      {
                          _currentSample.button.interactable = true;
                          await SceneManager.UnloadSceneAsync(_currentSample.buildIndex);
                      }
                      _currentSample = _scenes[index];
                      _currentSample.button.interactable = false;
                      await SceneManager.LoadSceneAsync(_scenes[index].buildIndex, LoadSceneMode.Additive);
                  }
              }
          }
          EOF

