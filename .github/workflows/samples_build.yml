name: Build Samples (reusable)

on:
  workflow_call:

jobs:
  build-samples:
    runs-on: ubuntu-latest
    env:
      UNITY_VERSION: 6000.2.8f1
      PKG_GIT: https://github.com/kevincastejon/com.caskev.grid-toolkit.git

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Prepare temp Unity project
        shell: bash
        run: |
          set -euo pipefail
          PROJ="$RUNNER_TEMP/GridToolkitTempProj_$(uuidgen | tr '[:upper:]' '[:lower:]' | tr -d '-')"
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$PROJ/Assets/Editor" \
                   "$PROJ/Assets/Settings/Build Profiles" \
                   "$PROJ/Packages" \
                   "$PROJ/ProjectSettings" \
                   "$OUT"
          printf "m_EditorVersion: %s\n" "$UNITY_VERSION" > "$PROJ/ProjectSettings/ProjectVersion.txt"

          cat > "$PROJ/Packages/manifest.json" <<EOF
          {
            "dependencies": {
              "com.unity.modules.ui": "1.0.0",
              "com.unity.modules.uielements": "1.0.0",
              "com.unity.ugui": "1.0.0",
              "com.unity.2d.tilemap": "1.1.0",
              "com.unity.2d.sprite": "1.0.0",
              "com.unity.test-framework": "1.4.5",
              "com.caskev.grid-toolkit": "$PKG_GIT"
            }
          }
          EOF

          cat > "$PROJ/Assets/SamplesOverview.unity" <<'EOF'
