name: Build Samples (reusable)
on:
  workflow_call:

jobs:
  build-samples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create temp Unity project
        env:
          UNITY_VER: 6000.2.8f1
        run: |
          mkdir -p TempProject/Assets TempProject/Packages TempProject/ProjectSettings
          cat > TempProject/Packages/manifest.json << 'JSON'
          {
            "dependencies": {
              "com.unity.modules.ui": "1.0.0",
              "com.unity.modules.uielements": "1.0.0",
              "com.unity.ugui": "1.0.0",
              "com.unity.textmeshpro": "3.0.9",
              "com.unity.2d.tilemap": "1.1.0",
              "com.unity.2d.sprite": "1.0.0",
              "com.unity.test-framework": "1.4.5",
              "com.caskev.grid-toolkit": "https://github.com/kevincastejon/com.caskev.grid-toolkit.git#${{ github.sha }}"
            }
          }
          JSON
          echo "m_EditorVersion: ${UNITY_VER}" > TempProject/ProjectSettings/ProjectVersion.txt

      - name: Add editor build script
        run: |
          mkdir -p TempProject/Assets/Editor
          cat > TempProject/Assets/Editor/BuildSamples.cs << 'CS'
          using System;
          using System.IO;
          using System.Linq;
          using System.Collections.Generic;
          using UnityEditor;
          using UnityEditor.PackageManager;
          using UnityEditor.PackageManager.UI;
          using UnityEngine;

          public static class BuildSamples
          {
              [Serializable] class PackageJson { public SampleEntry[] samples; }
              [Serializable] class SampleEntry { public string displayName; public string description; public string path; }

              [MenuItem("CI/Build WebGL Samples")]
              public static void Run()
              {
                  PlayerSettings.WebGL.compressionFormat = WebGLCompressionFormat.Brotli;
                  PlayerSettings.WebGL.decompressionFallback = true;

                  EnsureTmpEssentials();

                  string pkgName = "com.caskev.grid-toolkit";
                  var list = Client.List(true);
                  while (!list.IsCompleted) System.Threading.Thread.Sleep(50);
                  var pkg = list.Result.FirstOrDefault(p => p.name == pkgName);
                  if (pkg == null) throw new Exception("Package not found: " + pkgName);
                  string pkgVersion = pkg.version;

                  var samples = Sample.FindByPackage(pkgName, pkgVersion) ?? Array.Empty<Sample>();
                  if (samples.Length == 0) { Debug.LogWarning("No samples found via API"); return; }

                  string outRoot = "build-webgl";
                  Directory.CreateDirectory(outRoot);

                  foreach (var s in samples)
                  {
                      try
                      {
                          s.Import();
                          AssetDatabase.Refresh();
                          WaitForCompilation();

                          string importedDir = s.importPath.Replace('\\','/');
                          if (string.IsNullOrEmpty(importedDir) || !Directory.Exists(importedDir))
                          {
                              Debug.LogWarning("Imported dir missing for sample: " + s.displayName);
                              continue;
                          }

                          string folderName = Path.GetFileName(importedDir.TrimEnd('/', '\\'));
                          string safeName = MakeSafe(string.IsNullOrEmpty(s.displayName) ? folderName : s.displayName);

                          var wanted = new HashSet<string>(new[]{ folderName, s.displayName ?? folderName }, StringComparer.OrdinalIgnoreCase);
                          var scenes = Directory.GetFiles(importedDir, "*.unity", SearchOption.AllDirectories)
                                                .Where(p => wanted.Contains(Path.GetFileNameWithoutExtension(p)) || true)
                                                .Select(p => p.Replace('\\','/'))
                                                .ToArray();
                          if (scenes.Length == 0)
                          {
                              Debug.LogWarning("No scene found for sample: " + s.displayName);
                              continue;
                          }

                          string buildDir = Path.Combine(outRoot, safeName);
                          Directory.CreateDirectory(buildDir);

                          var report = BuildPipeline.BuildPlayer(scenes, buildDir, BuildTarget.WebGL, BuildOptions.None);
                          if (report.summary.result != UnityEditor.Build.Reporting.BuildResult.Succeeded)
                              throw new Exception("Build failed for sample: " + safeName);
                      }
                      catch (Exception ex)
                      {
                          Debug.LogWarning("Sample build skipped: " + s.displayName + " -> " + ex.Message);
                      }
                  }

                  AssetDatabase.Refresh();
              }

              static void EnsureTmpEssentials()
              {
                  var settings = AssetDatabase.LoadAssetAtPath<ScriptableObject>("Assets/TextMesh Pro/Resources/TMP Settings.asset");
                  if (settings) return;
                  EditorApplication.ExecuteMenuItem("Window/TextMeshPro/Import TMP Essential Resources");
                  AssetDatabase.Refresh();
                  WaitForCompilation();
              }

              static void WaitForCompilation()
              {
                  while (EditorApplication.isCompiling) System.Threading.Thread.Sleep(100);
              }

              static string MakeSafe(string name)
              {
                  foreach (char c in Path.GetInvalidFileNameChars()) name = name.Replace(c, '_');
                  return name;
              }
          }
          CS




      # - name: Cache Library
      #   uses: actions/cache@v3
      #   with:
      #     path: TempProject/Library
      #     key: Library-GridToolkit-WebGL-6000.2.8f1
      #     restore-keys: |
      #       Library-GridToolkit-WebGL-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: TempProject
          targetPlatform: WebGL
          unityVersion: 6000.2.8f1
          buildMethod: BuildSamples.Run
          versioning: None
          customParameters: -stackTraceLogType Full
      - name: Prepare samples artifact
        run: |
          set -e
          mkdir -p public-samples/samples
          cp -r TempProject/build-webgl/* public-samples/samples/ || true

          if [ ! -f public-samples/samples/index.html ]; then
            printf '%s\n' \
              '<!doctype html>' \
              '<meta charset="utf-8">' \
              '<title>Samples</title>' \
              '<h1>Samples</h1>' \
              '<ul id="list"></ul>' \
              '<script>' \
              "fetch('./').then(r=>r.text()).then(t=>{" \
              "  const rx=/href=\"([^\"]+)\\//g;let m,items=[];" \
              "  while((m=rx.exec(t))!==null){const n=m[1];if(!n.startsWith('.')&&n!=='')items.push(n);}" \
              "  const ul=document.getElementById('list');" \
              "  if(items.length===0){ul.innerHTML='<li>No samples</li>';return;}" \
              "  items.forEach(n=>{if(n==='index.html')return;const li=document.createElement('li');const a=document.createElement('a');a.href=n+'/index.html';a.textContent=n;li.appendChild(a);ul.appendChild(li);});" \
              '});' \
              '</script>' \
            > public-samples/samples/index.html
          fi
      - name: Upload samples artifact
        uses: actions/upload-artifact@v4
        with:
          name: samples-site
          path: public-samples
