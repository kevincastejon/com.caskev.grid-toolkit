          cat > "$PROJ/Assets/Editor/GridToolkitCIHelper.cs" <<'EOF'
          using System.Collections.Generic;
          using System.IO;
          using System.Linq;
          using UnityEditor;
          using UnityEditor.PackageManager.UI;
          public static class GridToolkitCIHelper
          {
              public static void Launch()
              {
                  PlayerSettings.WebGL.compressionFormat = WebGLCompressionFormat.Brotli;
                  PlayerSettings.WebGL.decompressionFallback = true;
                  ImportTMPEssentials();
              }
              public static void ImportTMPEssentials()
              {
                  try
                  {
                      var pkg = UnityEditor.PackageManager.PackageInfo.GetAllRegisteredPackages().FirstOrDefault(p => p.name == "com.unity.ugui");
                      string upkg = Path.Combine(pkg.resolvedPath, "Package Resources", "TMP Essential Resources.unitypackage");
                      System.Console.WriteLine("[TMP] Import non-interactif du package : " + upkg);
                      AssetDatabase.importPackageCompleted += ImportPackageCompleted;
                      AssetDatabase.ImportPackage(upkg, false);
                  }
                  catch (System.Exception ex)
                  {
                      System.Console.WriteLine("[TMP] Echec d'import : " + ex);
                  }
              }
              private static void ImportPackageCompleted(string packageName)
              {
                  UnityEngine.Debug.Log("[TMP] Import Package Completed");
                  AssetDatabase.importPackageCompleted -= ImportPackageCompleted;
                  ImportGridToolkitSamples();
              }
              public static void ImportGridToolkitSamples()
              {
                  string packageName = "com.caskev.grid-toolkit";
                  var info = UnityEditor.PackageManager.PackageInfo.FindForPackageName(packageName);
                  var samples = (Sample.FindByPackage(packageName, null) ?? Enumerable.Empty<Sample>()).ToList();
                  if (samples.Count == 0)
                  {
                      System.Console.WriteLine("[GridToolkit CIHelper] No samples");
                      EditorApplication.Exit(0);
                      return;
                  }
                  List<EditorBuildSettingsScene> newScenes = new()
                  {
                      new EditorBuildSettingsScene("Assets/SamplesOverview.unity", true)
                  };
                  foreach (var s in samples)
                  {
                      System.Console.WriteLine("[GridToolkit CIHelper] Sample: " + s.displayName);
                      if (!s.isImported)
                      {
                          try { s.Import(Sample.ImportOptions.None); } catch { s.Import(); }
                          System.Console.WriteLine("[GridToolkit CIHelper] Imported: " + s.displayName);
                      }
                      else
                      {
                          System.Console.WriteLine("[GridToolkit CIHelper] Already imported: " + s.displayName);
                      }
                      var scenePath = Path.Combine(s.importPath, s.displayName + ".unity");
                      if (File.Exists(scenePath))
                      {
                          newScenes.Add(new EditorBuildSettingsScene($"Assets/Samples/Grid Toolkit/{info.version}/{s.displayName}/{s.displayName}.unity", true));
                      }
                  }
                  EditorBuildSettings.scenes = newScenes.ToArray();
                  AssetDatabase.SaveAssets();
                  AssetDatabase.Refresh(ImportAssetOptions.ForceSynchronousImport | ImportAssetOptions.ForceUpdate);
                  System.Console.WriteLine("[GridToolkit CIHelper] Samples imported + refresh done");
                  EditorApplication.Exit(0);
              }
          }
          EOF

          echo "PROJ=$PROJ" >> $GITHUB_ENV
          echo "OUT=$OUT" >> $GITHUB_ENV

      - name: Unity pass 1 (import samples + scenes)
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: WebGL
          customParameters: >
            -batchmode
            -nographics
            -buildMethod: ''
            -projectPath "${{ env.PROJ }}"
            -buildTarget WebGL
            -executeMethod GridToolkitCIHelper.Launch
            -quit
            -logFile "${{ env.PROJ }}/Editor1.log"

      - name: Unity pass 2 (build via CLI)
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: WebGL
          customParameters: >
            -batchmode
            -nographics
            -projectPath "${{ env.PROJ }}"
            -buildTarget WebGL
            -build "${{ env.OUT }}"
            -activeBuildProfile "Assets/Settings/Build Profiles/Web.asset"
            -quit
            -logFile "${{ env.PROJ }}/Editor2.log"

      - name: Prepare samples artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-samples/samples
          shopt -s nullglob
          mv "${OUT}/WebGL"* public-samples/samples/ 2>/dev/null || mv "${OUT}"/* public-samples/samples/
          cp "${PROJ}/Editor1.log" public-samples/ || true
          cp "${PROJ}/Editor2.log" public-samples/ || true
        env:
          PROJ: ${{ env.PROJ }}
          OUT:  ${{ env.OUT }}

      - name: Upload samples artifact
        uses: actions/upload-artifact@v4
        with:
          name: samples-site
          path: public-samples
